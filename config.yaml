# 同步器 v2 配置文件(多组织) — 格式详见 V2-IMPLEMENTATION-GUIDE.md §3 / V2-DESIGN.md §12.1
# 密钥经 .env 注入(${VAR}), token 永不进 DB

global:
  weights_path: ${WEIGHTS_PATH}    # 可选: 未设/省略 → 默认 <项目根>/weights(可移植, 见 config.py)
  logger_name: applog

orgs:
  - id: Eco-Tech
    weights_subdir: Eco-Tech            # 默认 = id; 本地暂存 weights_path/<subdir>/{compare,updown}_weights
    scope:                              # ≈ v1 modelscope_cfg
      repo_name: ${SCOPE_REPO_NAME}
      token: ${SCOPE_TOKEN}
      license_name: "license"
      license: ["Apache License 2.0", "MIT License", "GPL-2.0", "GPL-3.0", "LGPL-3.0", "other"]
    modelers:                           # ≈ v1 modelers_cfg
      repo_name: ${MODELERS_REPO_NAME}
      token: ${MODELERS_TOKEN}
      license_name: "license"
      license: ["apache-2.0", "mit", "gpl-2.0", "gpl-3.0", "lgpl-3.0", "other"]
    gitcode:                            # 可选, 不配则跳过镜像
      token: ${GITCODE_TOKEN}
      repo_name: ${GITCODE_REPO_NAME}
      scope_base_url: "https://www.modelscope.cn/models/"

  # 新增组织示例: 每组织一套 .env 变量(<ORG_ID大写/连字符转下划线>_SCOPE_TOKEN 等)
  # - id: Gen_Line
  #   weights_subdir: Gen_Line
  #   scope: { repo_name: ${GEN_LINE_SCOPE_REPO_NAME}, token: ${GEN_LINE_SCOPE_TOKEN} }
  #   modelers: { repo_name: ${GEN_LINE_MODELERS_REPO_NAME}, token: ${GEN_LINE_MODELERS_TOKEN} }
  #   # 无 gitcode 块 → 该组织不做 GitCode 镜像

sync:
  model_interval_min: 15
  auto_delete_extra: true     # 严格镜像(2026-09 用户定稿): true = 魔乐独有文件一律自动删
                              # (含 .safetensors/>50MB, 保证与魔塔文件集严格一致, 避免新旧共存窗口);
                              # false = 只告警 delete_manual 人工确认(可用 server-work.py clean 执行)
  file_interval_min: 15            # 文件级周期(文件级删除已无宽限, 见 delete_grace_cycles 注释)
  full_audit_interval_h: 24
  forced_rehash_interval_d: 30     # 强哈希复核周期(天); 首次部署全量核验不受此限(见下)
  forced_rehash_batch: 800           # 强哈希每轮处理上限(首次全量分多轮跑, 避免阻塞对账)
  delete_grace_cycles: 3            # 【仅模型级】魔塔 repo 删除传播宽限轮数(文件级删除 2026-09 起无宽限, 对齐 v1)
  pipeline_max_models: 1

transfer:
  max_workers: 5
  verify_after_upload: true
  # task_timeout_s 已废弃: 不设"任务最长执行时间" —— 权重越来越大
  # (2.4T 千兆满速也要 5.6h+), 固定超时不可控; 失败重启次数由 retry.max_attempts
  # 三档政策控制(第1次原位重启 / 第2次压队列尾 / 达到上限停止等人工)。
  mode: overlap
  upload_cap_mbps: 0

retry:
  max_attempts: 3            # 失败机会次数: 第1次→原位重启, 第2次→压队列尾, 达到上限→停止拉起等人工
  # tail_backoff_s: 3600     # (可选) 第2次失败压队尾时附加的延迟秒数, 默认 0 = 仅排到队尾
  urgent_retry_s: [30, 120, 600]   # 紧急任务专用节奏(Phase 3 用)
  # base_backoff_s / max_backoff_s 已废弃: 不再用指数退避, 改为三档重启制

alert:
  webhook_url: ${ALERT_WEBHOOK_URL}
  failed_threshold: 3
  daily_summary: true
